<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Report Generator</title>
<style>
  :root {
    --teal: #07867a;
    --teal-dark: #066b61;
    --ink: #1a1a1a;
    --muted: #6b7280;
    --rule: #dde2e1;
    --bg: #f4f6f5;
    --err: #c2410c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 48px 20px 80px;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.55 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  .wrap { width: 100%; max-width: 520px; margin: 0 auto; }

  h1 {
    margin: 0 0 8px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .lede {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 16px;
  }

  .card {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 28px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-size: 15px;
    font-weight: 600;
  }

  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    font: inherit;
    color: var(--ink);
    background: #fff;
  }
  input[type=text]::placeholder { color: #9ca3a1; }

  .field { margin-bottom: 24px; }

  /* file picker */
  .drop {
    display: block;
    width: 100%;
    padding: 28px 20px;
    border: 2px dashed var(--rule);
    border-radius: 10px;
    background: #fcfdfd;
    text-align: center;
    cursor: pointer;
    font: inherit;
    color: var(--ink);
  }
  .drop:hover, .drop.over { border-color: var(--teal); background: #f2faf9; }
  .drop input { display: none; }
  .drop .big { display: block; font-weight: 600; margin-bottom: 4px; }
  .drop .small { display: block; color: var(--muted); font-size: 14px; }
  .drop .file { color: var(--teal); word-break: break-all; }

  button.go {
    width: 100%;
    margin-top: 4px;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: var(--teal);
    color: #fff;
    font: 600 16px/1 inherit;
    cursor: pointer;
  }
  button.go:hover:not(:disabled) { background: var(--teal-dark); }
  button.go:disabled { background: #a9c1be; cursor: default; }

  /* focus, visible for keyboard users */
  input[type=text]:focus-visible,
  .drop:focus-visible,
  button.go:focus-visible,
  .download:focus-visible {
    outline: 3px solid #7fd3cc;
    outline-offset: 2px;
  }

  /* result */
  .result {
    display: none;
    margin-top: 20px;
    padding: 20px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: #fff;
    text-align: center;
  }
  .result.show { display: block; }
  .result h2 { margin: 0 0 6px; font-size: 17px; font-weight: 700; }
  .result p  { margin: 0; color: var(--muted); font-size: 14.5px; }
  .result.error h2 { color: var(--err); }

  .download {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 26px;
    background: var(--teal);
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
  }
  .download:hover { background: var(--teal-dark); }

  .spinner {
    width: 18px; height: 18px;
    margin: 0 auto 10px;
    border: 2px solid #d7e7e5;
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .notice {
    display: none;
    margin-bottom: 20px;
    padding: 14px 16px;
    border: 1px solid #f0dfae;
    border-radius: 8px;
    background: #fffaee;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .notice.show { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: #d7e7e5; }
  }

  @media (max-width: 560px) {
    body { padding: 28px 16px 60px; }
    .card { padding: 22px 18px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <h1>Research Report Generator</h1>
  <p class="lede">Upload a company's financial document and get back a four-page
    PDF research note.</p>

  <p class="notice" id="notice"></p>

  <form class="card" id="form">

    <div class="field">
      <label for="company">Company name</label>
      <input type="text" id="company" name="company_name"
             placeholder="e.g. ICICI Bank" autocomplete="organization" required>
    </div>

    <div class="field">
      <label for="file">Financial document</label>
      <label class="drop" id="drop" for="file" tabindex="0">
        <input type="file" id="file" name="file" required>
        <span class="big" id="dropTitle">Choose a file, or drag one here</span>
        <span class="small" id="dropHint">PDF, CSV, Excel or text &mdash; up to 25 MB</span>
      </label>
    </div>

    <button type="submit" class="go" id="go">Generate report</button>
  </form>

  <div class="result" id="result"></div>

</div>

<script>
const $ = id => document.getElementById(id);
const form = $('form'), fileInput = $('file'), drop = $('drop');
const dropTitle = $('dropTitle'), dropHint = $('dropHint');
const go = $('go'), result = $('result');

/* Tell people up front if reports will come back empty. */
fetch('/api/health').then(r => r.json()).then(h => {
  if (!h.llm_configured) {
    const n = $('notice');
    n.textContent = 'No API key is set, so reports will be generated with the '
      + 'correct layout but no financial figures. Add GEMINI_API_KEY to your '
      + '.env file and restart to extract for real.';
    n.classList.add('show');
  }
}).catch(() => {});

/* file selection */
function sizeOf(bytes) {
  if (bytes < 1024) return bytes + ' bytes';
  if (bytes < 1048576) return Math.round(bytes / 1024) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function showFile() {
  const f = fileInput.files[0];
  if (!f) {
    dropTitle.textContent = 'Choose a file, or drag one here';
    dropTitle.classList.remove('file');
    dropHint.innerHTML = 'PDF, CSV, Excel or text &mdash; up to 25 MB';
    return;
  }
  dropTitle.textContent = f.name;
  dropTitle.classList.add('file');
  dropHint.textContent = sizeOf(f.size) + ' — click to choose a different file';
}

fileInput.addEventListener('change', showFile);

/* the drop zone is a <label>, so give it keyboard behaviour too */
drop.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fileInput.click(); }
});

['dragenter', 'dragover'].forEach(e =>
  drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(e =>
  drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => {
  if (ev.dataTransfer.files.length) { fileInput.files = ev.dataTransfer.files; showFile(); }
});

/* result panel */
function show(kind, title, body, link) {
  result.className = 'result show' + (kind === 'error' ? ' error' : '');
  result.innerHTML = '';
  if (kind === 'working') result.appendChild(Object.assign(
    document.createElement('div'), { className: 'spinner' }));

  const h = document.createElement('h2'); h.textContent = title;
  const p = document.createElement('p');  p.textContent = body;
  result.append(h, p);

  if (link) {
    const a = document.createElement('a');
    a.className = 'download';
    a.href = link;
    a.download = '';
    a.textContent = 'Download PDF';
    result.appendChild(a);
    a.focus();
  }
}

form.addEventListener('submit', async ev => {
  ev.preventDefault();
  go.disabled = true;
  go.textContent = 'Generating…';
  show('working', 'Generating your report', 'This usually takes about a minute.');

  try {
    const res = await fetch('/api/generate', { method: 'POST', body: new FormData(form) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || 'The report could not be generated.');

    show('done',
      'Your report is ready',
      body.used_llm
        ? (body.company_name || 'Report') + ' — 4 pages'
        : 'Layout only: no API key is set, so the financial fields are blank.',
      body.download_url);
  } catch (err) {
    show('error', 'That didn\'t work', err.message);
  } finally {
    go.disabled = false;
    go.textContent = 'Generate report';
  }
});
</script>
</body>
</html>
